<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Todo</h1>
    <form id="new-task">
      <input id="title" type="text" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
      <div class="row">
        <input id="due" type="date" aria-label="Due date">
        <input id="tags" type="text" placeholder="Tags, comma-separated" aria-label="Tags" autocomplete="off">
        <span id="priority-slot"></span>
        <span id="repeat-slot"></span>
        <button type="submit">Add</button>
      </div>
    </form>

    <div class="filters">
      <div id="status-filter" role="group" aria-label="Filter by status">
        <button type="button" data-status="all">All</button>
        <button type="button" data-status="active">Active</button>
        <button type="button" data-status="completed">Completed</button>
      </div>
      <div id="priority-filter" role="group" aria-label="Filter by priority">
        <button type="button" data-priority="all">All</button>
        <button type="button" data-priority="high">High</button>
        <button type="button" data-priority="medium">Medium</button>
        <button type="button" data-priority="low">Low</button>
      </div>
      <div id="tag-filter" role="group" aria-label="Filter by tag"></div>
    </div>

    <ul id="tasks"></ul>
    <p id="count"></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
